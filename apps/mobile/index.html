<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>QianNing Agent</title>
  </head>
  <body>
    <script>
      // The shared surface (ADR 0339) is opt-in until a device proves a prompt
      // round-trip; `?shared` loads the desktop renderer instead of this app.
      if (new URLSearchParams(location.search).has("shared")) {
        location.replace("./shared/index.html?surface=mobile");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

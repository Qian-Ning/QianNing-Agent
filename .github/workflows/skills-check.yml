name: Skills check

# ci.yml ignores `docs/**` and `**/*.md`, and a skill document is markdown: the
# provenance rule in CONTRIBUTING.md would never have run on the exact class of
# change it polices. This workflow owns the surfaces that rule covers — the
# documents themselves, the examples that ship with the repository, and the
# scripts that implement and test the rule — so a skill committed without an
# Origin section fails here instead of reaching users.
#
# The check imports nothing but `node:fs`/`node:path`, so this lane needs no
# install and no build: it finishes in seconds and cannot be broken by a
# dependency resolution problem.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/resources/skills/**'
      - 'examples/**/skills/**'
      - 'scripts/check-skill-provenance.mjs'
      - 'scripts/skill-provenance-check.mjs'
      - 'scripts/skill-provenance-check.test.mjs'
      - 'scripts/check-skill-authoring-spec.mjs'
      - 'scripts/skill-authoring-spec-check.mjs'
      - 'scripts/skill-authoring-spec-check.test.mjs'
      # The discovery predicates in scripts/skill-provenance-check.mjs are broader
      # than the shipped directories above: any markdown inside any `skills/`
      # directory, any `SKILL.md` anywhere, and a `manifest.json` inside any
      # `plugins/` directory. Naming them here is what keeps the trigger surface
      # equal to the discovery surface, so a document added under a new directory
      # cannot be policed by a lane it never runs.
      - '**/skills/**'
      - '**/SKILL.md'
      - '**/plugins/**'
      # ci.yml ignores `docs/**`, so the authoring spec would never trigger the
      # check that polices it unless it is named here.
      - 'docs/**/17-skill-authoring.md'
      - '.github/workflows/skills-check.yml'
  pull_request:
    paths:
      - 'apps/desktop/resources/skills/**'
      - 'examples/**/skills/**'
      - 'scripts/check-skill-provenance.mjs'
      - 'scripts/skill-provenance-check.mjs'
      - 'scripts/skill-provenance-check.test.mjs'
      - 'scripts/check-skill-authoring-spec.mjs'
      - 'scripts/skill-authoring-spec-check.mjs'
      - 'scripts/skill-authoring-spec-check.test.mjs'
      # The discovery predicates in scripts/skill-provenance-check.mjs are broader
      # than the shipped directories above: any markdown inside any `skills/`
      # directory, any `SKILL.md` anywhere, and a `manifest.json` inside any
      # `plugins/` directory. Naming them here is what keeps the trigger surface
      # equal to the discovery surface, so a document added under a new directory
      # cannot be policed by a lane it never runs.
      - '**/skills/**'
      - '**/SKILL.md'
      - '**/plugins/**'
      # ci.yml ignores `docs/**`, so the authoring spec would never trigger the
      # check that polices it unless it is named here.
      - 'docs/**/17-skill-authoring.md'
      - '.github/workflows/skills-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skill provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node as ci.yml (matches the runtime Electron 43 bundles).
          node-version: 24

      - name: Check skill provenance
        # Every discovered skill document must carry an `## Origin` section
        # opening with QianNing Agent, and every plugin manifest must name its
        # real author; neither may carry an upstream product name.
        run: node scripts/check-skill-provenance.mjs

      - name: Self-test the provenance rules
        # Guards the guard: the negative cases here are what prove a missing
        # Origin section, a wrong owner, and a stray upstream product name are
        # actually rejected rather than merely printed.
        run: node --test scripts/skill-provenance-check.test.mjs

  authoring-spec:
    name: Skill authoring spec
    # A separate job, not a step in the one above: this check polices a different
    # surface (the document format and its limits) and a failure here should be
    # legible on its own rather than buried under a provenance result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node as ci.yml (matches the runtime Electron 43 bundles).
          node-version: 24

      - name: Check the spec against the code
        # Every limit in the spec is derived from the constant that enforces it.
        # Changing the code without changing the document fails, and editing the
        # document to a different number fails too.
        run: node scripts/check-skill-authoring-spec.mjs

      - name: Self-test the authoring spec rules
        # Guards the guard. The negative cases are the substance: each removes or
        # changes one thing and asserts the check notices, including a renamed
        # constant, which must be a problem rather than a silent skip.
        run: node --test scripts/skill-authoring-spec-check.test.mjs

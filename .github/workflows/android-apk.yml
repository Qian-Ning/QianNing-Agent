# Android APK lane.
#
# The phone is sideloaded, so its updater asks the release page for the newest
# asset whose name ends in `-android.apk` (apps/mobile — AppUpdatePlugin). That
# made the APK a published artifact like any installer, but no workflow built
# it: releases 2.3.0 through 2.4.0 carried one because it was uploaded by hand,
# and v2.4.1 shipped without it, so every phone answered "no-apk-asset".
#
# This lane closes that: on a published release (and on demand for an existing
# tag) it builds the release APK with the same script a maintainer would run
# locally and attaches it under the name the updater looks for.
#
# The build is signed with the debug keystore the project configures for
# sideloading, so it needs no signing secret.

name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK to
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK and attach it
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Not android-actions/setup-android: it runs `sdkmanager tools`, and the
      # obsolete "tools" package no longer resolves, which fails the step before
      # anything is installed. The runner ships an SDK; ask its sdkmanager for
      # exactly the two packages the project compiles against.
      - name: Install the SDK the project compiles against
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          manager="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          test -x "$manager"
          "$manager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$manager" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The APK carries the shared surface as static files; the build script
      # refuses to package a tree that never produced them.
      - name: Build the shared surface the APK embeds
        working-directory: apps/mobile
        run: node scripts/build-shared-surface.mjs

      - name: Build the release APK
        working-directory: apps/mobile
        run: node scripts/build-apk.mjs --release

      - name: Name it the way the updater looks for it
        id: name
        run: |
          version="$(node -p "require('./apps/mobile/package.json').version")"
          source="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source"
          asset="QianNing-Agent-${version}-android.apk"
          mv "$source" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          files: ${{ steps.name.outputs.asset }}
          fail_on_unmatched_files: true
